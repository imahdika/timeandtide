<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bahrain fishing planner: Mina Salman tides, best fishing times, fishing spots map, fish seasons, SCE bans and sizes. English and Arabic.">
<meta name="theme-color" content="#1a93a8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a7a90'/%3E%3Cpath d='M6 38c6-8 12-8 18 0s12 8 18 0 12-8 16-2' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='18' r='6' fill='%23f4c665'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fishing Time &amp; Tide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --sky1:#9fdce8; --sky2:#e6f7f3; --sea1:#4dbdc8; --sea2:#1a93a8; --sea3:#0f7187;
  --glow:rgba(255,238,196,.95); --orb:#fffbea; --glitter:255,255,255;
  --glass:rgba(238,250,251,.72); --glass-hi:rgba(246,253,253,.82); --edge:rgba(255,255,255,.8);
  --shadow:rgba(3,52,68,.20); --chip:rgba(255,255,255,.55); --chip-edge:rgba(3,44,56,.10);
  --ink:#032c38; --ink-2:#1f4b57; --muted:#33606b; --line:rgba(3,44,56,.14);
  --accent:#e0a42a; --accent-ink:#855700; --accent-soft:rgba(240,176,52,.30);
  --good:#0f7d57; --good-soft:rgba(15,125,87,.14);
  --warn:#a95f05; --warn-soft:rgba(169,95,5,.15);
  --bad:#b8352b; --bad-soft:rgba(184,53,43,.13);
  --tide:#0a7a90; --tide-fill:rgba(10,122,144,.17); --night:rgba(3,44,56,.075);
  --water:#bfe5eb; --land:#f4efe1; --coast:#8fb3ad;
  --display:"Big Shoulders Display","IBM Plex Sans Arabic","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  --arabic:"IBM Plex Sans Arabic","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky1:#051628; --sky2:#11324b; --sea1:#0b3450; --sea2:#062137; --sea3:#010a16;
    --glow:rgba(190,214,255,.42); --orb:#f4f1e2; --glitter:214,230,255;
    --glass:rgba(6,26,42,.62); --glass-hi:rgba(8,32,50,.74); --edge:rgba(170,225,240,.17);
    --shadow:rgba(0,0,0,.42); --chip:rgba(255,255,255,.06); --chip-edge:rgba(200,235,245,.12);
    --ink:#e9f7fb; --ink-2:#c1dde6; --muted:#8bb2be; --line:rgba(200,235,245,.13);
    --accent:#f4c665; --accent-ink:#f4c665; --accent-soft:rgba(244,198,101,.2);
    --good:#55d49e; --good-soft:rgba(85,212,158,.14);
    --warn:#f2ab4c; --warn-soft:rgba(242,171,76,.15);
    --bad:#ff8272; --bad-soft:rgba(255,130,114,.15);
    --tide:#63d3e6; --tide-fill:rgba(99,211,230,.16); --night:rgba(0,0,0,.22);
    --water:#0b2c40; --land:#1c3a45; --coast:#4a7682;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky1:#051628; --sky2:#11324b; --sea1:#0b3450; --sea2:#062137; --sea3:#010a16;
  --glow:rgba(190,214,255,.42); --orb:#f4f1e2; --glitter:214,230,255;
  --glass:rgba(6,26,42,.62); --glass-hi:rgba(8,32,50,.74); --edge:rgba(170,225,240,.17);
  --shadow:rgba(0,0,0,.42); --chip:rgba(255,255,255,.06); --chip-edge:rgba(200,235,245,.12);
  --ink:#e9f7fb; --ink-2:#c1dde6; --muted:#8bb2be; --line:rgba(200,235,245,.13);
  --accent:#f4c665; --accent-ink:#f4c665; --accent-soft:rgba(244,198,101,.2);
  --good:#55d49e; --good-soft:rgba(85,212,158,.14);
  --warn:#f2ab4c; --warn-soft:rgba(242,171,76,.15);
  --bad:#ff8272; --bad-soft:rgba(255,130,114,.15);
  --tide:#63d3e6; --tide-fill:rgba(99,211,230,.16); --night:rgba(0,0,0,.22);
  --water:#0b2c40; --land:#1c3a45; --coast:#4a7682;
}

*{box-sizing:border-box}
body{background:var(--sea2);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-family:var(--arabic);font-size:15.5px;line-height:1.65}
html[lang="ar"] *{letter-spacing:0!important}
#sea{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:clamp(16px,2.4vw,26px)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--edge);border-radius:24px;box-shadow:0 18px 50px -18px var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);padding:clamp(18px,2.6vw,30px)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(28px,3.4vw,38px);text-transform:uppercase}
h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:var(--arabic);font-weight:700;line-height:1.3}
html[lang="ar"] h2{font-size:clamp(24px,3vw,32px)}
html[lang="ar"] h3{font-size:19px}
p{margin:0}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.ar{font-family:var(--arabic)}
.ltr{direction:ltr;unicode-bidi:isolate}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px;margin-bottom:18px}
.sec-head p{max-width:60ch;color:var(--ink-2)}

/* ===== HEADER ===== */
.board-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px}
.brand h1{font-size:clamp(44px,6.4vw,82px);text-transform:uppercase;letter-spacing:-.005em}
html[lang="ar"] .brand h1{font-size:clamp(38px,5.6vw,68px)}
.brand h1 .amp{color:var(--accent-ink);font-weight:600}
.brand .where{margin-top:8px;color:var(--ink-2);font-weight:500}
.nowbox{text-align:end;display:flex;flex-direction:column;gap:2px;align-items:flex-end;margin-inline-start:auto}
.nowbox .clock{font-family:var(--display);font-size:clamp(40px,5vw,60px);font-weight:700;line-height:.95}
.nowbox .dayl{font-weight:600}
.nowbox .next{color:var(--ink-2);font-size:14px}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.langbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--chip-edge);background:var(--chip);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;color:inherit}
.langbtn .ar{font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-edge);white-space:nowrap}
.pill.official{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.model{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.est{color:var(--ink-2);background:var(--line);border-color:transparent}
.back-today{border:1px solid var(--chip-edge);background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;margin-inline-start:8px}
.tide-wrap{position:relative;margin-top:18px;direction:ltr}
.tide-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.tide-wrap svg text{font-family:var(--body);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--glass-hi);border:1px solid var(--edge);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 8px 24px -8px var(--shadow);transform:translate(-50%,-110%);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tide-events{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.tev{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--chip);border:1px solid var(--chip-edge)}
.tev .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tev .t{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.tev .h{font-size:13px;color:var(--ink-2)}
.tev.past{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 16px;margin-top:18px;border-top:1px solid var(--line)}
.stat{padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .l{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.stat .s{font-size:13px;color:var(--ink-2);line-height:1.4}
.src-line{margin-top:12px;font-size:12.5px;color:var(--muted)}

/* ===== ADVICE ===== */
.advice{background:var(--glass-hi)}
.best-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px 36px;align-items:end}
.best-range{font-family:var(--display);font-weight:800;font-size:clamp(54px,8.4vw,118px);max-width:100%;line-height:.86;letter-spacing:-.01em;margin-top:8px;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
html[lang="ar"] .best-range{text-align:right}
.best-range .dash{color:var(--accent-ink);font-weight:600;padding-inline:.06em}
.rating{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.stars{color:var(--accent);font-size:22px;letter-spacing:2px;line-height:1;direction:ltr}
.stars .off{color:var(--line)}
.score{font-weight:700;color:var(--ink-2)}
.why{margin-top:10px;font-size:17px;color:var(--ink-2);max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:0;list-style:none}
.chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-edge)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.slow{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.alt-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.alt{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.alt .tt{font-family:var(--display);font-size:26px;font-weight:700;white-space:nowrap;direction:ltr}
.alt .ds{font-size:13.5px;color:var(--ink-2)}
.alt .sc{font-size:14px;color:var(--accent);letter-spacing:1px;direction:ltr}
.alt.past{opacity:.5}
.alt.past .tt{text-decoration:line-through;text-decoration-thickness:2px}
.advice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 32px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.advice-grid h3{margin-bottom:12px}
.fishchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;border-radius:12px;background:var(--chip);border:1px solid var(--chip-edge);font-weight:600;font-size:14px}
.fchip.gen{border-style:dashed;border-color:var(--muted);background:transparent}
.fchip .ar{font-size:15px}
.sz{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
.zone-list{display:flex;flex-direction:column;gap:12px}
.zone .zl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.zone .zl svg{flex:none}
.zone .zf{margin-top:4px;font-weight:500}
.reads{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.reads li{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:14px;line-height:1.45}
.reads b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.subnote{font-size:12.5px;color:var(--muted);margin-top:10px}

/* AI */
.ai{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.ai-controls{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field select{appearance:none;-webkit-appearance:none;background:var(--chip);border:1px solid var(--chip-edge);border-radius:12px;padding-block:9px;padding-inline:12px 34px;max-width:100%;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
html[dir="rtl"] .field select{background-position:17px 55%,12px 55%}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--glass-hi)}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--chip-edge)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.ai-out{margin-top:18px;padding:18px 20px;border-radius:18px;background:var(--chip);border:1px solid var(--chip-edge);max-width:78ch;font-size:15px;line-height:1.6}
.ai-out h4{font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.02em;margin:16px 0 6px}
html[lang="ar"] .ai-out h4{font-family:var(--arabic);font-size:18px}
.ai-out h4:first-child{margin-top:0}
.ai-out ul,.ai-out ol{margin:4px 0 8px;padding-inline-start:20px}
.ai-out li{margin:3px 0}
.ai-out p{margin:6px 0}
.ai-state{font-size:13px;color:var(--muted);margin-top:8px}
.thinking{display:inline-flex;align-items:center;gap:10px;color:var(--ink-2);font-weight:600}
.thinking i{width:10px;height:10px;border-radius:50%;background:var(--tide);animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}

/* ===== WEEK ===== */
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-4px;padding-inline:4px}
.day{scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;text-align:start;border:1px solid var(--chip-edge);background:var(--chip);border-radius:18px;padding:14px;cursor:pointer;color:inherit;transition:transform .15s ease,border-color .15s ease}
.day:hover{transform:translateY(-2px);border-color:var(--accent)}
.day.sel{border:2px solid var(--accent);padding:13px}
.day .dh{display:flex;justify-content:space-between;align-items:start;gap:8px}
.day .blk,.day .rng,.day .bar,.day .wd,.day .dt{display:block}
.day .wd{font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;line-height:1}
html[lang="ar"] .day .wd{font-family:var(--arabic);font-size:20px;font-weight:700}
.day .dt{font-size:13px;color:var(--muted);font-weight:600}
.day .mn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-2);font-weight:600;flex:none}
.day .rng{font-size:12.5px;color:var(--ink-2)}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--tide)}
.day .win{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.day .w1{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;white-space:nowrap;direction:ltr;text-align:start}
.day .w2{font-size:13px;color:var(--ink-2)}
.day .ws{font-size:13px;color:var(--accent);letter-spacing:1px;direction:ltr;text-align:start}
.day .wind{font-size:12.5px;color:var(--muted)}
.day .src{align-self:flex-start}

/* ===== FISH ===== */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--chip);border:1px solid var(--chip-edge)}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--glass-hi)}
.fish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.fcard{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;background:var(--chip);border:1px solid var(--chip-edge)}
.fcard .arn{font-family:var(--arabic);font-size:28px;font-weight:600;line-height:1.2}
.fcard .en{font-weight:700;font-size:15px}
.fcard .sci{font-style:italic;color:var(--muted);font-size:13px;direction:ltr;text-align:start}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:7px;background:var(--line);color:var(--ink-2);text-transform:uppercase}
.tag.st-open{background:var(--good-soft);color:var(--good)}
.tag.st-line{background:var(--warn-soft);color:var(--warn)}
.tag.st-ban{background:var(--bad-soft);color:var(--bad)}
.facts{display:grid;grid-template-columns:82px 1fr;gap:6px 12px;margin:0;font-size:14px;line-height:1.45}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.facts dd{margin:0}
.fcard .tipline{font-size:13.5px;color:var(--ink-2);border-inline-start:3px solid var(--accent);padding-inline-start:10px}
.fcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;align-items:center}
.fcard .acts a{font-size:13px;font-weight:600}
.fcard .ai-out{margin-top:4px;padding:12px 14px;font-size:14px}

/* image calendar */
.cal-block{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.allyear{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-radius:16px;background:var(--accent-soft);margin-top:14px}
.allyear .ar{font-size:20px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.mcell{padding:12px 12px 14px;border-radius:16px;background:var(--chip);border:1px solid var(--chip-edge);display:flex;flex-direction:column;gap:8px;min-width:0}
.mcell.cur{border:2px solid var(--accent);padding:11px 11px 13px}
.mcell .mh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mcell .mn{font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1}
html[lang="ar"] .mcell .mn{font-family:var(--arabic);font-size:17px;font-weight:700}
.mcell .mi{font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted);line-height:1}
.mfish{display:flex;flex-wrap:wrap;gap:6px}
.mf{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--chip-edge);background:var(--glass-hi);border-radius:10px;padding:4px 9px;font-size:13px;font-weight:600;cursor:pointer;color:inherit}
.mf .ar{font-size:15px}
.mf.closed{border-color:var(--bad);color:var(--bad)}
.mf.closed::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad)}
.mf[disabled]{cursor:default}
.mempty{font-size:12.5px;color:var(--muted)}
.cal-ai{margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:10px;border-radius:3px}

/* ===== RULES ===== */
.rules-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px 36px}
.active{padding:16px 18px;border-radius:18px;background:var(--warn-soft);border:1px solid var(--warn);display:flex;flex-direction:column;gap:6px}
.active + .active{margin-top:10px}
.active.full{background:var(--bad-soft);border-color:var(--bad)}
.active.none{background:var(--good-soft);border-color:var(--good)}
.active .big{font-family:var(--display);font-size:28px;font-weight:800;text-transform:uppercase;line-height:1.1}
html[lang="ar"] .active .big{font-family:var(--arabic);font-size:21px;font-weight:700}
.gantt{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.grow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:13.5px}
.gtrack{position:relative;height:18px;border-radius:5px;background:var(--line);direction:ltr}
.gseg{position:absolute;top:0;bottom:0;border-radius:5px}
.gseg.full{background:var(--bad)}
.gseg.net{background:repeating-linear-gradient(135deg,var(--warn) 0 4px,transparent 4px 8px);border:1px solid var(--warn)}
.gnow{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.gmonths{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.gmonths div:last-child{display:grid;grid-template-columns:repeat(12,1fr);direction:ltr}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.size{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;border-radius:12px;background:var(--chip);border:1px solid var(--chip-edge)}
.size .ar{font-size:15px;font-weight:600}
.size small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--body)}
.size b{font-family:var(--display);font-size:22px;white-space:nowrap}
.news{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.news li{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.news time{font-weight:700;color:var(--muted);font-size:12.5px;padding-top:2px}
.news a{font-weight:600}


/* ===== SPOTS MAP ===== */
.spots-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.mapbox{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--chip-edge);background:var(--water);height:min(78vh,720px);direction:ltr}
.mapbox svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapbox svg.drag{cursor:grabbing}
.mapbox .land{fill:var(--land);stroke:var(--coast);vector-effect:non-scaling-stroke;stroke-width:1}
.mapbox .place{fill:var(--muted);font-family:var(--body);font-weight:700;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.mapbox .pin{cursor:pointer}
.mapbox .pin circle,.mapbox .pin rect{fill:var(--accent);stroke:var(--ink);vector-effect:non-scaling-stroke;stroke-width:1.5}
.mapbox .pin.market rect{fill:var(--tide)}
.mapbox .pin.dim{opacity:.22}
.mapbox .pin.sel circle,.mapbox .pin.sel rect{stroke-width:3;fill:var(--bad)}
.mapbox .pin text{fill:var(--ink);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--land);vector-effect:non-scaling-stroke;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.map-ctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.map-ctl button{width:38px;height:38px;border-radius:12px;border:1px solid var(--chip-edge);background:var(--glass-hi);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.map-scale{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:var(--ink-2)}
.map-scale i{display:block;height:5px;border:2px solid var(--ink-2);border-top:0}
.map-hint{position:absolute;left:12px;top:12px;max-width:calc(100% - 76px);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--glass-hi);padding:4px 10px;border-radius:999px;border:1px solid var(--chip-edge)}
.spot-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.spot-filter{display:flex;flex-wrap:wrap;gap:6px}
.spot-filter button{border:1px solid var(--chip-edge);background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.spot-filter button[aria-pressed="true"]{background:var(--ink);color:var(--glass-hi);border-color:var(--ink)}
.spot-search{width:100%;border:1px solid var(--chip-edge);background:var(--chip);border-radius:12px;padding:9px 12px;font:inherit;color:inherit}
.spot-card{padding:16px;border-radius:18px;background:var(--accent-soft);border:1px solid var(--accent);display:flex;flex-direction:column;gap:8px}
.spot-card .nm{font-family:var(--arabic);font-size:22px;font-weight:700;line-height:1.3}
.spot-card .en2{font-weight:600;color:var(--ink-2)}
.spot-card .co{font-size:13px;color:var(--muted);direction:ltr;text-align:start}
.spot-card .sup-actions a.btn{text-decoration:none}
.spot-list{list-style:none;margin:0;padding:0;max-height:430px;overflow-y:auto;border-top:1px solid var(--line)}
.spot-list li{border-bottom:1px solid var(--line)}
.spot-list button{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:9px 4px;cursor:pointer;color:inherit}
.spot-list button[aria-current="true"]{background:var(--accent-soft)}
.spot-list .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#032c38;font-size:12px;font-weight:800}
.spot-list .n.m{border-radius:7px;background:var(--tide);color:#fff}
.spot-list .t{display:flex;flex-direction:column;min-width:0}
.spot-list .t b{font-weight:600}
.spot-list .t small{color:var(--muted);font-size:12.5px}
@media (max-width:900px){.spots-grid{grid-template-columns:1fr}.mapbox{height:min(70vh,560px)}}

/* ===== SUPPORT ===== */
.sup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sup-card{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:20px;background:var(--chip);border:1px solid var(--chip-edge)}
.sup-card.give{background:var(--accent-soft);border-color:var(--accent)}
.sup-card .phone{font-family:var(--display);font-size:clamp(40px,5.4vw,58px);font-weight:800;line-height:1;margin-top:4px;user-select:all;-webkit-user-select:all;text-align:start}
.sup-card .phone .cc{font-weight:600;color:var(--muted);font-size:.55em;vertical-align:.25em}
html[dir="rtl"] .sup-card .phone{text-align:right}
.sup-actions{display:flex;flex-wrap:wrap;gap:8px}
.sup-actions a.btn{text-decoration:none}
@media (max-width:760px){.sup-grid{grid-template-columns:1fr}}

/* ===== SOURCES ===== */
.sources{font-size:13.5px}
.sources ul{columns:2 320px;column-gap:32px;margin:12px 0 0;padding-inline-start:18px}
.sources li{margin-bottom:6px;break-inside:avoid}
.sources .method{margin-top:14px;color:var(--ink-2);max-width:90ch}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .best-wrap{grid-template-columns:1fr}
  .advice-grid{grid-template-columns:1fr}
  .rules-grid{grid-template-columns:1fr}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){
  body{font-size:14.5px}
  .nowbox{text-align:start;align-items:flex-start;margin-inline-start:0}
  .glass{border-radius:20px}
  .grow,.gmonths{grid-template-columns:96px 1fr}
  .news li{grid-template-columns:1fr;gap:2px}
  .reads li{grid-template-columns:1fr;gap:2px}
  .alt{grid-template-columns:1fr auto}
  .alt .ds{grid-column:1 / -1}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){
  .day{transition:none}
  .thinking i{animation:none}
}
</style>
</head>
<body>


<canvas id="sea" aria-hidden="true"></canvas>

<main class="page">
  <header class="glass board" id="board">
    <div class="topbar"><a class="langbtn" href="#support" data-t="supLink"></a><button class="langbtn" id="langBtn" type="button"></button></div>
    <div class="board-top">
      <div class="brand">
        <h1 id="brandTitle"></h1>
        <p class="where" data-t="where"></p>
      </div>
      <div class="nowbox">
        <div class="dayl" id="dayLabel"></div>
        <div class="clock num" id="clock"></div>
        <div class="next" id="nextTide"></div>
        <div id="viewCtl"></div>
      </div>
    </div>
    <div class="tide-wrap" id="tideWrap">
      <svg id="tideSvg" role="img"></svg>
      <div class="tip" id="tideTip" hidden></div>
    </div>
    <div class="tide-events" id="tideEvents"></div>
    <div class="stats" id="stats"></div>
    <p class="src-line" id="srcLine"></p>
  </header>

  <section class="glass advice" id="advice" aria-labelledby="bestLbl">
    <div class="best-wrap">
      <div>
        <div class="eyebrow" id="bestLbl"></div>
        <div class="best-range num" id="bestRange"></div>
        <div class="rating"><span class="stars" id="bestStars"></span><span class="score" id="bestScore"></span></div>
        <p class="why" id="bestWhy"></p>
        <ul class="chips" id="bestChips"></ul>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:8px"><span data-t="allWin"></span> · <span id="altDay"></span></div>
        <div class="alt-list" id="altList"></div>
        <p class="subnote" data-t="winNote"></p>
      </div>
    </div>
    <div class="advice-grid">
      <div>
        <h3 id="seasonTitle"></h3>
        <div class="fishchips" id="seasonNow"></div>
        <p class="subnote" id="seasonNext"></p>
      </div>
      <div>
        <h3 data-t="typesTitle"></h3>
        <div class="zone-list" id="zones"></div>
      </div>
      <div>
        <h3 data-t="readTitle"></h3>
        <ul class="reads" id="reads"></ul>
      </div>
    </div>
    <div class="ai" id="aiBox">
      <h3 data-t="aiTitle"></h3>
      <p class="muted" style="margin-top:6px;max-width:75ch" data-t="aiDesc"></p>
      <div class="ai-controls">
        <div class="field"><label for="aiStyle" data-t="lblStyle"></label><select id="aiStyle"></select></div>
        <div class="field"><label for="aiSpot" data-t="lblSpot"></label><select id="aiSpot"></select></div>
        <button class="btn" id="aiGo" type="button" data-t="aiGo"></button>
        <button class="btn ghost" id="aiStop" type="button" data-t="aiStop" hidden></button>
      </div>
      <div class="ai-out" id="aiOut" hidden></div>
      <p class="ai-state" id="aiState"></p>
    </div>
  </section>

  <section class="glass" aria-labelledby="weekH">
    <div class="sec-head">
      <div><div class="eyebrow" data-t="weekEyebrow"></div><h2 id="weekH" data-t="weekTitle"></h2></div>
      <p data-t="weekDesc"></p>
    </div>
    <div class="week-strip" id="week"></div>
  </section>


  <section class="glass" id="spots" aria-labelledby="spotsH">
    <div class="sec-head">
      <div><div class="eyebrow" data-t="spotsEyebrow"></div><h2 id="spotsH" data-t="spotsTitle"></h2></div>
      <p data-t="spotsDesc"></p>
    </div>
    <div class="spots-grid">
      <div class="mapbox" id="mapbox">

/* ================= CHART ================= */
function renderChart() {
  const wrap = $("tideWrap"), svg = $("tideSvg");
  const W = Math.max(320, Math.round(wrap.clientWidth || 800)); const narrow = W < 560;
  const H = narrow ? 210 : 240; const P = { l: narrow ? 30 : 38, r: 10, t: 34, b: 26 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const d0 = dayStart(sel), d1 = d0 + DAY; const YMAX = 3.25;
  const x = t => P.l + (t - d0) / DAY * pw, y = h => P.t + (1 - h / YMAX) * ph;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const [rise, set] = sunTimes(sel); const wins = windowsFor(sel);
  const top3 = [...wins].sort((a, b) => b.score - a.score).slice(0, 3);
  const M = L("m","م");
  let s = `<rect x="${x(d0)}" y="${P.t}" width="${x(rise) - x(d0)}" height="${ph}" style="fill:var(--night)"/><rect x="${x(set)}" y="${P.t}" width="${x(d1) - x(set)}" height="${ph}" style="fill:var(--night)"/>`;
  for (let m = 0; m <= 3; m++) s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(m)}" y2="${y(m)}" style="stroke:var(--line)"/><text x="${P.l - 6}" y="${y(m) + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${m} ${M}</text>`;
  top3.forEach(w => { s += `<rect x="${x(w.a)}" y="${P.t}" width="${x(w.b) - x(w.a)}" height="${ph}" style="fill:var(--accent-soft)"/><rect x="${x(w.a)}" y="${P.t}" width="${x(w.b) - x(w.a)}" height="3" style="fill:var(--accent)"/>`; });
  const step = narrow ? 6 : 3;
  for (let hh = 0; hh <= 24; hh += step) s += `<text x="${x(d0 + hh * HR)}" y="${H - 6}" text-anchor="${hh === 0 ? "start" : hh === 24 ? "end" : "middle"}" font-size="11" style="fill:var(--muted)">${pad(hh)}:00</text>`;
  [[rise, "↑"], [set, "↓"]].forEach(([t, a]) => { s += `<text x="${x(t)}" y="${P.t - 20}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--muted)">${a} ${hm(t)}</text><line x1="${x(t)}" x2="${x(t)}" y1="${P.t - 14}" y2="${P.t}" style="stroke:var(--muted)"/>`; });
  let path = "";
  for (let t = d0; t <= d1; t += 10 * MIN) { const v = tideAt(t); if (v) path += (path ? "L" : "M") + x(t).toFixed(1) + "," + y(v.h).toFixed(1); }
  s += `<path d="${path}L${x(d1)},${y(0)}L${x(d0)},${y(0)}Z" style="fill:var(--tide-fill)"/><path d="${path}" fill="none" style="stroke:var(--tide)" stroke-width="2.25" stroke-linejoin="round"/>`;
  dayEvents(sel).forEach(e => {
    const ex = x(e.t), ey = y(e.h); const anchor = ex < P.l + 40 ? "start" : ex > W - 50 ? "end" : "middle";
    s += `<circle cx="${ex}" cy="${ey}" r="5" style="fill:var(--tide);stroke:var(--glass-hi)" stroke-width="2.5"/><text x="${ex}" y="${e.k === "H" ? ey - 11 : ey + 20}" text-anchor="${anchor}" font-size="12" font-weight="700" style="fill:var(--ink)">${e.k === "H" ? L("H","مد") : L("L","جزر")} ${hm(e.t)}</text>`;
  });
  if (sel === TODAY) {
    const n = nowMs(); const v = tideAt(n);
    if (v) s += `<line x1="${x(n)}" x2="${x(n)}" y1="${P.t}" y2="${y(0)}" style="stroke:var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="${x(n)}" cy="${y(v.h)}" r="6" style="fill:var(--accent);stroke:var(--glass-hi)" stroke-width="2.5"/><text x="${x(n) + 6}" y="${P.t - 4}" font-size="11" font-weight="700" style="fill:var(--ink)">${L("NOW","الآن")} ${hm(n)}</text>`;
  }
  s += `<line id="hx" x1="0" x2="0" y1="${P.t}" y2="${y(0)}" style="stroke:var(--ink);opacity:0"/><circle id="hd" cx="0" cy="0" r="4.5" style="fill:var(--ink);opacity:0"/><rect id="hit" x="${P.l}" y="0" width="${pw}" height="${H}" fill="transparent" style="cursor:crosshair"/>`;
  svg.innerHTML = s;
  svg.setAttribute("aria-label", L(`Tide at Mina Salman on ${longDate(sel)}. `, `المد والجزر في ميناء سلمان يوم ${longDate(sel)}. `) + dayEvents(sel).map(e => `${e.k === "H" ? L("High","مد") : L("Low","جزر")} ${hm(e.t)} ${e.h} ${M}`).join(", "));
  const hit = svg.querySelector("#hit"), hx = svg.querySelector("#hx"), hd = svg.querySelector("#hd"), tip = $("tideTip");
  const move = ev => {
    const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) * (W / r.width);
    const t = d0 + Math.min(1, Math.max(0, (sx - P.l) / pw)) * DAY; const v = tideAt(t); if (!v) return;
    hx.setAttribute("x1", x(t)); hx.setAttribute("x2", x(t)); hx.style.opacity = .35; hd.setAttribute("cx", x(t)); hd.setAttribute("cy", y(v.h)); hd.style.opacity = 1;
    const inWin = wins.find(w => t >= w.a && t <= w.b);
    tip.textContent = `${hm(t)} · ${v.h.toFixed(2)} ${M} · ${v.rising ? L("rising","صاعد") : L("falling","نازل")}${inWin ? " · " + starTxt(inWin.score) : ""}`;
    tip.hidden = false; tip.style.left = Math.min(r.width - 90, Math.max(90, x(t) / W * r.width)) + "px"; tip.style.top = (y(v.h) / H * r.height) + "px";
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; hx.style.opacity = 0; hd.style.opacity = 0; });
}

/* ================= ADVICE ================= */
function pickBest(key) {
  const wins = windowsFor(key); const now = nowMs();
  if (key === TODAY) {
    const left = wins.filter(w => w.b > now);
    if (left.length) return { w: [...left].sort((a, b) => b.score - a.score)[0], label: L("Best window left today","أفضل نافذة متبقية اليوم"), key };
    const nk = addDays(key, 1);
    return { w: [...windowsFor(nk)].sort((a, b) => b.score - a.score)[0], label: L("Today's windows are over · best tomorrow","انتهت نوافذ اليوم · الأفضل غداً"), key: nk };
  }
  return { w: [...wins].sort((a, b) => b.score - a.score)[0], label: L("Best time to fish","أفضل وقت للصيد"), key };
}

}

}

function langRule() {
  return lang === "ar" ? "اكتب الإجابة كاملة باللغة العربية الواضحة، واستخدم أسماء الأسماك المحلية في البحرين، واستخدم كلمة «حداق» للصيد بالخيط اليدوي." : "Write in clear English. Give local fish names in English letters with the Arabic name in brackets once.";
}
function planPrompt() {
  const key = sel; const m = monthOf(key), nm = m % 12 + 1;
  const style = STYLE_OPTS.find(o => o[0] === $("aiStyle").value)[3], spot = SPOT_OPTS.find(o => o[0] === $("aiSpot").value)[3];

ANGLER: ${style}. FISHING FROM: ${spot}.
Current Bahrain time: ${hm(nowMs())} on ${TODAY}. Plan is for: ${key}.

CONDITIONS
${conditionsText(key)}

TIDE WINDOWS (30–120 min either side of each high or low, slack water left out; scored for tide range, light, wind and moon)
${windowsText(key)}

WEEK AHEAD
${weekText()}

SEASON
${calText(m)}
${calText(nm)}
Species facts: ${ids.map(id => FISH.find(f => f.id === id)).filter(Boolean).map(fishFacts).join(" | ")}

SHORE FISHING SPOTS (number, name, area, local note)
${SPOTS.filter(x => !x.market).map(x => `${x.n}. ${x.ar} / ${x.en} (${REGIONS[x.region][0]})${x.noteEn ? " - " + x.noteEn : ""}`).join("; ")}

RULES
${BANS.map(b => `- ${b.name[0]}: ${b.type === "net" ? "nets banned" : "fully closed"} ${b.from[1]}/${b.from[0]} – ${b.to[1]}/${b.to[0]}${banActive(b, key) ? " (IN FORCE on this date)" : ""}`).join("\n")}
- Minimum sizes (SCE Resolution 3/2025): ${SIZES.map(s => s[0] + " " + s[2] + " cm").join(", ")}.

TASK
Write a practical plan using these exact section headings:
## ${heads[0]}
Pick one or two time ranges from the windows${key === TODAY ? " that have not passed yet" : ""}. Two or three bullets on why.${/shore/i.test(spot) ? " Then suggest 2 or 3 spots from the spot list that suit this time, tide and the target fish, using their exact names and numbers." : ""}
## ${heads[1]}
3–4 fish ranked for this angler, spot and month. For each: depth zone (surface / mid-water / bottom), method (jig, cast, bottom handline or float), a handline rig${/rod/i.test(style) ? " and a simple beginner rod setup" : ""} (line strength, hook size, sinker or jig weight), bait, and typical weight. Skip any fish in a closed season.
## ${heads[2]}
Water temperature and clarity, wind, pressure and moon.
## ${heads[3]}
The 2 best days and why.
## ${heads[4]}
Legal sizes for the fish you picked, bans in force, heat safety.

Under 420 words, bullets. Use only the times and facts given; do not invent tide times, regulations or place names.
${langRule()}`;
}
function fishPrompt(id) {
  const f = FISH.find(x => x.id === id); const n = labelOf(id); const key = sel;
  const months = f ? bestMonths(f) : imgMonths(id);
  const best = [...windowsFor(key)].sort((a, b) => b.score - a.score).slice(0, 3).map(w => `${hm(w.a)}–${hm(w.b)}`).join("; ");
  const style = STYLE_OPTS.find(o => o[0] === $("aiStyle").value)[3], spot = SPOT_OPTS.find(o => o[0] === $("aiSpot").value)[3];
  const heads = lang === "ar" ? ["المكان والوقت","الطريقة والعُدّة","الطُعم","الحجم والوزن","التعامل والأنظمة"] : ["Where and when","Method and rig","Bait and lures","Size and weight","Handling and rules"];
  return `You are an expert Bahrain angler. Give a deep-dive on catching this fish in Bahrain waters.

FISH: local Bahraini name ${n.ar} (${n.tr}).${f ? " Known facts: " + fishFacts(f) : " If you are not sure which species this Bahraini name refers to, say so in one line and give general advice."}
Good months (fish calendar${f && !f.img ? ", general guide" : " image"}): ${months.map(i => MON.en[i - 1]).join(", ")}.
Legal minimum: ${MINLEN[id] || (f && f.minLen) ? (MINLEN[id] || f.minLen) + " cm" : "none listed"}. Status on ${key}: ${statusOf(id, key).t}.
ANGLER: ${style}. FISHING FROM: ${spot}.
CONDITIONS
${conditionsText(key)}
Top tide windows: ${best}

Sections with these ## headings: ${heads.join(" · ")}. Under 230 words, bullets, no invented regulations.
${langRule()}`;
}
function renderMD(el, text) {
  el.innerHTML = ""; el.dir = lang === "ar" ? "rtl" : "ltr"; let list = null;
  const inline = (parent, s) => s.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
    if (/^\*\*[^*]+\*\*$/.test(part)) { const b = document.createElement("strong"); b.textContent = part.slice(2, -2); parent.append(b); }
    else if (part) parent.append(document.createTextNode(part.replace(/(^|\s)\*([^*]+)\*/g, "$1$2")));
  });
  text.split("\n").forEach(raw => {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { list = null; return; }
    if ((m = line.match(/^\s*#{1,4}\s+(.*)$/))) { list = null; const h = document.createElement("h4"); inline(h, m[1]); el.append(h); return; }
    if ((m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/))) { if (!list) { list = document.createElement(/^\s*\d/.test(line) ? "ol" : "ul"); el.append(list); } const li = document.createElement("li"); inline(li, m[1]); list.append(li); return; }
    list = null; const p = document.createElement("p"); inline(p, line); el.append(p);
  });
}
const ERR = {
  not_granted: ["Claude access was not allowed for this page.","لم يُسمح لهذه الصفحة باستخدام Claude."], sampling_disabled: ["Claude isn't available on this account.","Claude غير متاح لهذا الحساب."],
  rate_limited: ["Too many requests right now. Try again in a minute.","طلبات كثيرة الآن. حاول بعد دقيقة."], session_expired: ["Sign in to Claude again, then retry.","سجّل الدخول إلى Claude مجدداً ثم أعد المحاولة."],
  refused: ["Claude declined this request. Try a different option.","رفض Claude هذا الطلب. جرّب خياراً آخر."], empty_completion: ["No answer came back. Try again.","لم تصل إجابة. حاول مجدداً."],
  upstream_error: ["The answer was interrupted. Try again.","انقطعت الإجابة. حاول مجدداً."]
};
const errTxt = c => { const e = ERR[c] || ERR.upstream_error; return L(e[0], e[1]); };
const HIDE = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
function thinking(el, msg) { el.hidden = false; el.dir = lang === "ar" ? "rtl" : "ltr"; el.innerHTML = `<span class="thinking"><i></i>${esc(msg)}</span>`; }
async function runPlan() {
  if (!sample) return;
  const out = $("aiOut"), go = $("aiGo"), stop = $("aiStop"), st = $("aiState");
  aiCtl = new AbortController(); go.disabled = true; stop.hidden = false;
  thinking(out, L("Weighing tides, light, wind, moon and season…","أوازن المد والضوء والرياح والقمر والموسم…"));
  try {
    const res = await sample(planPrompt(), { modelTier: "complex", signal: aiCtl.signal, onText: ({ text }) => renderMD(out, text) });
    st.textContent = res.truncated ? L("The answer was cut short. Try again.","انقطعت الإجابة. حاول مجدداً.") : L(`Plan for ${longDate(sel)}.`, `خطة ليوم ${longDate(sel)}.`);
  } catch (e) {
    if (e && e.text) renderMD(out, e.text); else if (!e || e.code !== "cancelled") out.hidden = true;
    if (e && HIDE.includes(e.code)) disableAI(ERR[e.code] || ["The AI plan isn't available here.","الخطة الذكية غير متاحة هنا."]);
    else st.textContent = e && e.code === "cancelled" ? L("Stopped.","تم الإيقاف.") : errTxt(e && e.code);
  } finally { go.disabled = !aiReady; stop.hidden = true; }
}
async function fishAI(id, out, btn) {
  if (!sample) return; btn.disabled = true;
  thinking(out, L(`Working out ${labelOf(id).tr}…`, `أجهّز شرح ${labelOf(id).ar}…`));
  try { await sample(fishPrompt(id), { modelTier: "default", onText: ({ text }) => renderMD(out, text) }); }
  catch (e) {
    if (e && e.text) renderMD(out, e.text); else { out.dir = lang === "ar" ? "rtl" : "ltr"; out.textContent = errTxt(e && e.code); }
    if (e && HIDE.includes(e.code)) disableAI(ERR[e.code] || ["The AI plan isn't available here.","الخطة الذكية غير متاحة هنا."]);
  } finally { btn.disabled = !aiReady; }
}
function disableAI(msg) { aiReady = false; aiMsg = msg; setAIState(); document.querySelectorAll(".ai-fish").forEach(b => b.hidden = true); document.querySelectorAll(".mf").forEach(b => b.disabled = true); $("calTapNote").hidden = true; }
document.querySelectorAll("[data-copy]").forEach(btn => btn.addEventListener("click", () => {
  const txt = btn.dataset.copy; const done = () => { btn.textContent = L("Copied", "تم النسخ"); setTimeout(() => { btn.textContent = L(STR.copyNum[0], STR.copyNum[1]); }, 1800); };
  const fallback = () => { const el = btn.closest(".sup-card").querySelector(".pn"); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = L("Selected. Copy it now", "تم التحديد، انسخه الآن"); };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (_) { fallback(); }
}));
$("aiGo").addEventListener("click", runPlan);
$("aiStop").addEventListener("click", () => aiCtl && aiCtl.abort());

renderAll();
(async () => {
  try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (_) { sample = null; }
  if (!sample) { disableAI(["The AI plan works only in the Claude version of this page. Everything else works here.","الخطة الذكية تعمل فقط في نسخة الصفحة داخل Claude، وباقي الصفحة يعمل هنا."]); return; }
  aiReady = true; aiMsg = null; setAIState(); renderFish();
})();

/* ================= SEA BACKGROUND ================= */
const cv = $("sea"), ctx = cv.getContext("2d");
let Wc = 0, Hc = 0, col = {}, glints = [];
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
function readColors() { const cs = getComputedStyle(document.documentElement); ["--sky1","--sky2","--sea1","--sea2","--sea3","--glow","--orb","--glitter"].forEach(k => col[k] = cs.getPropertyValue(k).trim()); }
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5); Wc = innerWidth; Hc = innerHeight;
  cv.width = Math.round(Wc * dpr); cv.height = Math.round(Hc * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  glints = Array.from({ length: Math.round(Wc / 9) }, () => ({ u: Math.random(), v: Math.random(), p: Math.random() * 6.28, s: .6 + Math.random() * 1.6 }));
}
function draw(t) {
  const hz = Hc * 0.26, ox = Wc * 0.74;
  let g = ctx.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, col["--sky1"]); g.addColorStop(1, col["--sky2"]); ctx.fillStyle = g; ctx.fillRect(0, 0, Wc, hz + 1);
  const rg = ctx.createRadialGradient(ox, hz, 0, ox, hz, Math.max(Wc, Hc) * .45); rg.addColorStop(0, col["--glow"]); rg.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = rg; ctx.fillRect(0, 0, Wc, hz + 1);
  ctx.fillStyle = col["--orb"]; ctx.beginPath(); ctx.arc(ox, hz - Hc * .09, Math.max(14, Math.min(Wc, Hc) * .032), 0, 6.2832); ctx.fill();
  g = ctx.createLinearGradient(0, hz, 0, Hc); g.addColorStop(0, col["--sea1"]); g.addColorStop(.45, col["--sea2"]); g.addColorStop(1, col["--sea3"]); ctx.fillStyle = g; ctx.fillRect(0, hz, Wc, Hc - hz);
  const glc = col["--glitter"];
  for (let i = 0; i < 14; i++) {
    const f = i / 13, yb = hz + (Hc - hz) * Math.pow(f, 1.7) + 4, amp = 1 + f * 7, len = 60 + f * 260, sp = (0.15 + f * .5) * t / 1000;
    ctx.beginPath();
    for (let xx = 0; xx <= Wc + 20; xx += 12) { const yy = yb + Math.sin(xx / len * 6.2832 + sp + i * 1.7) * amp + Math.sin(xx / (len * .37) - sp * 1.3 + i) * amp * .35; xx ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.strokeStyle = `rgba(${glc},${0.05 + f * 0.09})`; ctx.lineWidth = 1 + f * 1.4; ctx.stroke();
  }
  for (const q of glints) {
    const yy = hz + 3 + Math.pow(q.v, 1.5) * (Hc - hz) * .9, spread = 14 + (yy - hz) * .55;
    const xx = ox + (q.u - .5) * 2 * spread + Math.sin(t / 900 + q.p) * 4, a = Math.max(0, Math.sin(t / 420 * q.s + q.p)) * (1 - q.v * .7) * .75;
    if (a < .05) continue; ctx.fillStyle = `rgba(${glc},${a.toFixed(3)})`; ctx.fillRect(xx, yy, 3 + (yy - hz) * .025, 1.2 + (yy - hz) * .004);
  }
}
let last = 0, raf = 0;
function loop(t) { raf = requestAnimationFrame(loop); if (document.hidden || t - last < 33) return; last = t; draw(t); }
function start() { cancelAnimationFrame(raf); readColors(); resize(); if (reduce.matches) draw(0); else raf = requestAnimationFrame(loop); }
start();
addEventListener("resize", () => { resize(); if (reduce.matches) draw(0); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); if (reduce.matches) draw(0); });
reduce.addEventListener("change", start);
new MutationObserver(() => { readColors(); if (reduce.matches) draw(0); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
